<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- mac3D Wallpaper mark — the one source for the site logo, favicon,
       touch icon, share image and the Mac app icon (mac app/icon/icon.html).
       A snow-capped peak against a low dawn sun, with paper-cut ridges
       stacked in front: a wallpaper with depth. The menu bar glyph
       (mac app/Sources/StatusIcon.swift) draws the same peak and sun.
       After changing it, run scripts/make-web-icons.sh (favicons, touch
       icon, share image) and rebuild the Mac app (delete build/AppIcon.icns). -->
<defs>
<clipPath id="peaks-tile"><rect width="100" height="100" rx="22.5"/></clipPath>
<clipPath id="peaks-far-clip"><path d="M-4 66 40 63 56 61 64 59 72 57 79 54 84 51 88 49 92 51.5 96 54 104 52.5V104H-4Z"/></clipPath>
<clipPath id="peaks-hero-clip"><path d="M-6.7 63.52 2.84 55.04 10.26 48.68 14.5 46.56 19.8 40.73 26.16 32.78 32.52 24.3 37.29 17.41 41 7.95 45.24 17.41 48.95 21.65 52.66 20.06 56.9 26.95 62.2 35.43 67.5 43.38 73.86 51.86 81.28 59.28 89.76 64.58 107.78 68.82V104H-4Z"/></clipPath>
<clipPath id="peaks-snowlit-clip"><path d="M41 11.58 44.18 24.3 43.12 34.9 44.18 42.32 71.74 42.32 71.74 -4.32 41 -4.32Z"/></clipPath>
<linearGradient id="peaks-sky" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1e1b5e"/><stop offset="0.14" stop-color="#3a2c82"/><stop offset="0.27" stop-color="#83418d"/><stop offset="0.38" stop-color="#e06a8b"/><stop offset="0.5" stop-color="#ffa087"/><stop offset="0.64" stop-color="#ffd09a"/><stop offset="1" stop-color="#ffe6b0"/></linearGradient>
<linearGradient id="peaks-far" x1="0" y1="48" x2="0" y2="68" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f29fa5"/><stop offset="1" stop-color="#ffc8ac"/></linearGradient>
<linearGradient id="peaks-shade" x1="0" y1="12" x2="0" y2="72" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2c1d5a"/><stop offset="0.6" stop-color="#43266c"/><stop offset="1" stop-color="#804888"/></linearGradient>
<linearGradient id="peaks-lit" x1="0" y1="12" x2="0" y2="72" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#963d7e"/><stop offset="0.55" stop-color="#b04d82"/><stop offset="1" stop-color="#c86088"/></linearGradient>
<linearGradient id="peaks-snowsh" x1="0" y1="12" x2="0" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e4dcf7"/><stop offset="1" stop-color="#a998da"/></linearGradient>
<linearGradient id="peaks-snowlit" x1="0" y1="12" x2="0" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd6c8"/></linearGradient>
<linearGradient id="peaks-mid" x1="0" y1="64" x2="0" y2="86" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#451f6e"/><stop offset="1" stop-color="#713785"/></linearGradient>
<linearGradient id="peaks-near" x1="0" y1="77" x2="0" y2="95" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2d1b62"/><stop offset="1" stop-color="#4a2c78"/></linearGradient>
<linearGradient id="peaks-front" x1="0" y1="88" x2="0" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1a1446"/><stop offset="1" stop-color="#251c55"/></linearGradient>
<radialGradient id="peaks-glow" cx="74" cy="47.5" r="50" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffd7a8" stop-opacity=".75"/>
<stop offset=".32" stop-color="#ffa48e" stop-opacity=".4"/>
<stop offset="1" stop-color="#ff8c8c" stop-opacity="0"/>
</radialGradient>
<radialGradient id="peaks-sun" cx=".42" cy=".38" r=".7">
<stop offset="0" stop-color="#fffbf2"/><stop offset=".55" stop-color="#fff0c9"/>
<stop offset="1" stop-color="#ffdca6"/>
</radialGradient>
<linearGradient id="peaks-rim" x1="56.9" y1="26.95" x2="81.28" y2="59.28" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffe8d6" stop-opacity="0"/><stop offset=".5" stop-color="#fff1d8" stop-opacity=".9"/>
<stop offset="1" stop-color="#ffd0b0" stop-opacity="0"/>
</linearGradient>
<linearGradient id="peaks-warm" x1="44" y1="0" x2="82" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffb08f" stop-opacity="0"/><stop offset="1" stop-color="#ffb08f" stop-opacity=".4"/>
</linearGradient>
<linearGradient id="peaks-mist" x1="0" y1="55" x2="0" y2="74" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffc4aa" stop-opacity="0"/><stop offset=".75" stop-color="#ffc4aa" stop-opacity=".27"/>
<stop offset="1" stop-color="#ffc4aa" stop-opacity=".1"/>
</linearGradient>
<linearGradient id="peaks-gloss" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<filter id="peaks-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
<filter id="peaks-sh" x="-10%" y="-40%" width="120%" height="180%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
<feOffset dy="-1.1" result="b"/>
<feFlood flood-color="#1a0730" flood-opacity=".55"/>
<feComposite in2="b" operator="in"/>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<g clip-path="url(#peaks-tile)">
<rect width="100" height="100" fill="url(#peaks-sky)"/>
<rect width="100" height="100" fill="url(#peaks-glow)"/>
<g fill="#fff"><circle cx="14" cy="14" r="0.55" opacity="0.85"/><circle cx="24" cy="8.5" r="0.4" opacity="0.6"/><circle cx="63" cy="11" r="0.45" opacity="0.7"/><circle cx="79" cy="19" r="0.6" opacity="0.8"/><circle cx="88" cy="9" r="0.4" opacity="0.55"/><circle cx="8" cy="26" r="0.35" opacity="0.45"/><circle cx="55" cy="6" r="0.3" opacity="0.5"/></g>
<circle cx="74" cy="47.5" r="14.5" fill="url(#peaks-sun)"/>
<path d="M-4 66 40 63 56 61 64 59 72 57 79 54 84 51 88 49 92 51.5 96 54 104 52.5V104H-4Z" fill="url(#peaks-far)"/>
