<path d="M22.98 36.81 27.75 45.5 24.57 57.16 20.86 74.12 -13.06 74.12 -13.06 27.48Z" fill="#8466c0" opacity=".18"/>
<path d="M41 11.58 44.18 24.3 43.12 34.9 47.89 46.56 51.6 59.28 55.84 74.12 55 110 120 110 120 -5 41 -5Z" fill="url(#peaks-lit)"/>
<path d="M41 11.58 44.18 24.3 43.12 34.9 47.89 46.56 51.6 59.28 55.84 74.12 55 110 120 110 120 -5 41 -5Z" fill="url(#peaks-warm)"/>
<path d="M16.62 28.54 21.92 35.43 26.16 32.25 29.87 38.08 34.11 31.72 37.82 39.14 41.53 31.19 45.24 39.14 48.95 31.72 52.66 35.96 56.37 30.13 63.79 37.87 69.62 37.87 69.62 -4.32 16.62 -4.32Z" fill="url(#peaks-snowsh)"/>
<path d="M16.62 28.54 21.92 35.43 26.16 32.25 29.87 38.08 34.11 31.72 37.82 39.14 41.53 31.19 45.24 39.14 48.95 31.72 52.66 35.96 56.37 30.13 63.79 37.87 69.62 37.87 69.62 -4.32 16.62 -4.32Z" fill="url(#peaks-snowlit)" clip-path="url(#peaks-snowlit-clip)"/>
</g>
<path d="M56.9 26.95 62.2 35.43 67.5 43.38 73.86 51.86 81.28 59.28" fill="none" stroke="url(#peaks-rim)" stroke-width="1.2" stroke-linejoin="round" clip-path="url(#peaks-hero-clip)"/>
<rect y="55" width="100" height="20" fill="url(#peaks-mist)"/>
<path d="M-4 67.5C-2.65 67.05 2.75 64.72 5 64.5C7.25 64.28 8.45 64.88 11 66C13.55 67.12 18.7 71.47 22 72C25.3 72.53 30.3 69.65 33 69.5C35.7 69.35 37.15 70.17 40 71C42.85 71.83 48.7 74.78 52 75C55.3 75.22 59.3 73.25 62 72.5C64.7 71.75 67.75 70.15 70 70C72.25 69.85 74.3 70.67 77 71.5C79.7 72.33 85 75.5 88 75.5C91 75.5 94.6 72.4 97 71.5C99.4 70.6 102.95 69.8 104 69.5V104H-4Z" fill="url(#peaks-mid)" filter="url(#peaks-sh)"/>
<path d="M-4 80.5C-1.9 80.12 6.1 78 10 78C13.9 78 18.4 79.53 22 80.5C25.6 81.47 30.4 84.12 34 84.5C37.6 84.88 42.7 82.85 46 83C49.3 83.15 52.7 85.65 56 85.5C59.3 85.35 64.4 82.9 68 82C71.6 81.1 76.4 79.42 80 79.5C83.6 79.58 88.4 82.2 92 82.5C95.6 82.8 102.2 81.65 104 81.5V104H-4Z" fill="url(#peaks-near)" filter="url(#peaks-sh)"/>
