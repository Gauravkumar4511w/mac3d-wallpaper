<!doctype html>
<!-- App icon master (1024×1024, transparent corners). Rendered to PNG by make-icon.sh.
     The artwork is the site's brand mark (landing page/public/icon.svg), so the
     app icon, favicon and site logo stay the same. This page only places it on
     the macOS icon grid (an 824 px tile) and adds the drop shadow. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
      }
      img {
        position: absolute;
        left: 100px;
        top: 92px;
        width: 824px;
        height: 824px;
        filter: drop-shadow(0 22px 22px rgba(20, 8, 40, 0.35));
      }
    </style>
  </head>
  <body>
    <img src="../../landing%20page/public/icon.svg" alt="" />
  </body>
</html>
